<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodEye - IP Sorgu</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%231a1a2e' stroke='%23e94560' stroke-width='3'/><circle cx='50' cy='48' r='16' fill='%23990000'/><circle cx='50' cy='48' r='7' fill='%23000'/><circle cx='46' cy='44' r='3' fill='%23ff4444'/><path d='M20 30 L40 38' stroke='%23e94560' stroke-width='3' stroke-linecap='round'/><path d='M80 30 L60 38' stroke='%23e94560' stroke-width='3' stroke-linecap='round'/></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <svg width="200" height="65" viewBox="0 0 200 65">
                    <defs>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="1.5" result="blur"/>
                            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                        <radialGradient id="nazar" cx="40%" cy="40%">
                            <stop offset="0%" stop-color="#1a1aff"/>
                            <stop offset="40%" stop-color="#0000cc"/>
                            <stop offset="100%" stop-color="#000066"/>
                        </radialGradient>
                    </defs>
                    <g transform="translate(0, 3)">
                        <rect x="0" y="0" width="60" height="60" rx="3" fill="#ff0000"/>
                        <path d="M0 15 Q10 10 20 15 Q30 20 40 15 Q50 10 60 15" fill="none" stroke="#cc0000" stroke-width="1" opacity="0.5"/>
                        <path d="M0 30 Q10 25 20 30 Q30 35 40 30 Q50 25 60 30" fill="none" stroke="#cc0000" stroke-width="1" opacity="0.5"/>
                        <path d="M0 45 Q10 40 20 45 Q30 50 40 45 Q50 40 60 45" fill="none" stroke="#cc0000" stroke-width="1" opacity="0.5"/>
                        <path d="M25 17 Q21 25 25 35 Q30 28 35 26 Q30 20 25 17Z" fill="white"/>
                        <polygon points="36,22 38,26 42,27 39,30 40,34 36,32 32,34 33,30 30,27 34,26" fill="white"/>
                    </g>
                    <g transform="translate(90, 0) rotate(-15, 40, 32)">
                        <rect x="58" y="35" width="18" height="8" rx="3" fill="#c0c0c0" stroke="#999" stroke-width="1" transform="rotate(40, 67, 39)"/>
                        <circle cx="37" cy="30" r="26" fill="#1a1a2e" stroke="#c0c0c0" stroke-width="4" filter="url(#glow)"/>
                        <circle cx="37" cy="30" r="24" fill="none" stroke="#e94560" stroke-width="0.8" opacity="0.4"/>
                        <path d="M18 18 Q22 14 28 16" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
                    </g>
                    <g transform="translate(115, 32)">
                        <ellipse cx="12" cy="12" rx="18" ry="20" fill="#0a0a2e" stroke="#1a1aff" stroke-width="2" filter="url(#glow)"/>
                        <ellipse cx="12" cy="12" rx="14" ry="16" fill="none" stroke="#1a1aff" stroke-width="2.5"/>
                        <ellipse cx="12" cy="12" rx="10" ry="12" fill="url(#nazar)"/>
                        <ellipse cx="12" cy="12" rx="7" ry="8.5" fill="#000033"/>
                        <circle cx="10" cy="10" r="3.5" fill="#000000"/>
                        <circle cx="8" cy="8" r="1.5" fill="white" opacity="0.8"/>
                        <ellipse cx="6" cy="6" rx="3" ry="4" fill="white" opacity="0.1"/>
                    </g>
                </svg>
                <span class="logo-text">Blood<span class="logo-accent">Eye</span></span>
            </div>
        </div>
        <textarea id="ipInput" placeholder="İp adresi içeren metinleri girin...&#10;Örn:&#10;8.8.8.8 Google DNS&#10;1.1.1.1 Cloudflare"></textarea>
        <button id="sorguBtn">Sorgula</button>
        <button id="exportBtn" style="display:none; background:#0f3460;">Excel'e Aktar</button>
        <div id="sonuc"></div>
        <div id="vtPanel" style="display:none;">
            <div class="vt-baslik">
                🛡️ Virustotal Tarama
                <span id="vtDurum" class="vt-durum">Bekleniyor...</span>
            </div>
            <div id="vtSonuc"></div>
        </div>
        <div id="listeler" style="display:none;">
            <div class="liste-kutu blacklist">
                <div class="liste-baslik">
                    ⛔ Black List <span class="liste-aciklama">(AbuseIPDB ≥20 veya ipinfo ≥20)</span>
                    <button class="copyBtn" onclick="kopyala('blacklist')">📋 Kopyala</button>
                </div>
                <textarea id="blacklist" readonly placeholder="Black list IP'leri burada görünür..."></textarea>
            </div>
            <div class="liste-kutu whitelist">
                <div class="liste-baslik">
                    ✅ White List <span class="liste-aciklama">(Tüm puanlar &lt;20)</span>
                    <button class="copyBtn" onclick="kopyala('whitelist')">📋 Kopyala</button>
                </div>
                <textarea id="whitelist" readonly placeholder="White list IP'leri burada görünür..."></textarea>
            </div>
        </div>
        <footer class="footer">Created by <span class="footer-name">Tarkovic</span></footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
